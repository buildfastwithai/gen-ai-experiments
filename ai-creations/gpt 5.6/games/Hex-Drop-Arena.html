<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7143d8">
  <title>Hex Drop Arena</title>
  <style>:root {
  --ink: #17142f;
  --cream: #fffdf2;
  --pink: #ff3ea5;
  --yellow: #ffdb3d;
  --cyan: #32dcff;
  --violet: #7b4dff;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  overflow: hidden;
  background: #7143d8;
  color: var(--cream);
}

body,
button {
  font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
}

button {
  color: inherit;
}

button:focus-visible {
  outline: 4px solid #fff;
  outline-offset: 4px;
}

.game-shell {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.26), transparent 26%),
    linear-gradient(180deg, #643bd0 0%, #a85de6 58%, #f969c0 100%);
}

.game-canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.scene-host {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.grain {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.19;
  background-image: radial-gradient(rgba(255, 255, 255, 0.8) 0.55px, transparent 0.6px);
  background-size: 5px 5px;
  mix-blend-mode: soft-light;
}

.hud {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  padding: clamp(16px, 2.5vw, 34px);
}

.hud-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.brand-lockup,
.survivor-card,
.hint-bar,
.floor-chip {
  filter: drop-shadow(0 7px 0 rgba(37, 18, 83, 0.2));
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-mark {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 3px solid rgba(255, 255, 255, 0.9);
  border-radius: 15px;
  background: var(--pink);
  box-shadow: inset 0 -5px 0 rgba(113, 12, 76, 0.18);
  transform: rotate(-7deg);
  font-size: 23px;
  line-height: 1;
}

.brand-word {
  text-transform: uppercase;
  font-size: clamp(19px, 2.2vw, 28px);
  font-weight: 1000;
  line-height: 0.88;
  letter-spacing: -0.055em;
  text-shadow: 0 3px 0 #3f258d;
}

.brand-word span {
  display: block;
  color: var(--yellow);
  font-size: 0.62em;
  letter-spacing: 0.16em;
  margin-left: 2px;
  margin-top: 6px;
}

.survivor-card {
  min-width: 128px;
  padding: 9px 15px 11px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  border-radius: 18px;
  color: var(--ink);
  background: rgba(255, 253, 242, 0.94);
  box-shadow: inset 0 -5px 0 rgba(62, 41, 105, 0.1);
  text-align: right;
}

.survivor-card small {
  display: block;
  margin-bottom: 2px;
  color: #745c91;
  font-size: 10px;
  font-weight: 1000;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.survivor-count {
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 6px;
  font-size: 24px;
  font-weight: 1000;
  line-height: 1;
}

.survivor-count b {
  color: var(--pink);
  font-size: 31px;
}

.match-info {
  position: absolute;
  top: clamp(80px, 12vh, 118px);
  right: clamp(16px, 2.5vw, 34px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 9px;
}

.timer {
  padding: 5px 10px;
  border-radius: 9px;
  background: rgba(34, 20, 72, 0.54);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.08em;
  backdrop-filter: blur(6px);
}

.floor-chip {
  padding: 7px 12px;
  border: 2px solid rgba(255, 255, 255, 0.7);
  border-radius: 999px;
  background: rgba(105, 58, 189, 0.68);
  font-size: 10px;
  font-weight: 1000;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  backdrop-filter: blur(6px);
}

.hint-bar {
  position: absolute;
  bottom: clamp(18px, 3vh, 30px);
  left: 50%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 8px 13px 8px 10px;
  border: 2px solid rgba(255, 255, 255, 0.32);
  border-radius: 999px;
  background: rgba(37, 23, 77, 0.62);
  transform: translateX(-50%);
  backdrop-filter: blur(10px);
  white-space: nowrap;
}

.hint-bar span {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.03em;
}

.key-cluster {
  display: flex;
  align-items: center;
  gap: 4px;
}

kbd {
  min-width: 27px;
  height: 25px;
  display: inline-grid;
  place-items: center;
  padding: 0 6px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-bottom-width: 3px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.16);
  font: 900 10px/1 ui-monospace, monospace;
}

.countdown {
  position: absolute;
  top: 46%;
  left: 50%;
  z-index: 7;
  transform: translate(-50%, -50%) rotate(-3deg);
  pointer-events: none;
  color: #fff;
  font-size: clamp(84px, 18vw, 190px);
  font-weight: 1000;
  line-height: 0.75;
  letter-spacing: -0.08em;
  -webkit-text-stroke: clamp(4px, 0.8vw, 10px) var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 11px 0 var(--pink);
  animation: countdown-pop 0.42s cubic-bezier(0.18, 1.45, 0.4, 1) both;
}

@keyframes countdown-pop {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.35) rotate(6deg);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-3deg);
  }
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 44%, rgba(70, 30, 140, 0.08), rgba(26, 12, 64, 0.58));
  backdrop-filter: blur(3px);
}

.intro-card,
.result-card {
  width: min(92vw, 590px);
  text-align: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding: 7px 13px;
  border: 2px solid rgba(255, 255, 255, 0.55);
  border-radius: 999px;
  background: rgba(70, 33, 137, 0.66);
  font-size: 11px;
  font-weight: 1000;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  box-shadow: 0 5px 0 rgba(47, 17, 94, 0.18);
}

.eyebrow-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 0 4px rgba(50, 220, 255, 0.2);
}

.hero-title,
.result-title {
  margin: 0;
  text-transform: uppercase;
  font-size: clamp(70px, 12vw, 126px);
  font-weight: 1000;
  line-height: 0.71;
  letter-spacing: -0.075em;
  transform: rotate(-2deg);
  -webkit-text-stroke: clamp(2px, 0.45vw, 5px) #fff;
  paint-order: stroke fill;
  text-shadow:
    0 10px 0 #3b207e,
    0 18px 30px rgba(29, 8, 72, 0.35);
}

.hero-title .hex,
.result-title .hex {
  display: block;
  color: var(--yellow);
}

.hero-title .drop {
  display: block;
  margin-left: 0.28em;
  color: var(--pink);
}

.hero-copy {
  width: min(100%, 455px);
  margin: 30px auto 21px;
  color: rgba(255, 255, 255, 0.89);
  font: 700 15px/1.5 Arial, sans-serif;
  text-shadow: 0 2px 10px rgba(24, 7, 69, 0.45);
}

.primary-button {
  position: relative;
  min-width: 210px;
  padding: 15px 25px 18px;
  border: 4px solid #fff;
  border-radius: 20px;
  background: linear-gradient(#ff61bc, #f62f9c);
  box-shadow:
    inset 0 -7px 0 rgba(131, 10, 77, 0.22),
    0 9px 0 #492193,
    0 17px 25px rgba(30, 11, 72, 0.28);
  cursor: pointer;
  text-transform: uppercase;
  font-size: 21px;
  font-weight: 1000;
  letter-spacing: 0.06em;
  transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
}

.primary-button:hover {
  filter: brightness(1.08);
  transform: translateY(-3px) rotate(-1deg);
  box-shadow:
    inset 0 -7px 0 rgba(131, 10, 77, 0.22),
    0 12px 0 #492193,
    0 20px 28px rgba(30, 11, 72, 0.3);
}

.primary-button:active {
  transform: translateY(5px);
  box-shadow:
    inset 0 -4px 0 rgba(131, 10, 77, 0.2),
    0 4px 0 #492193;
}

.intro-meta {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin-top: 25px;
  color: rgba(255, 255, 255, 0.78);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.intro-meta span::before {
  content: "✦";
  margin-right: 6px;
  color: var(--yellow);
}

.result-card {
  width: min(92vw, 520px);
  padding: 38px 30px 42px;
  border: 5px solid #fff;
  border-radius: 36px;
  background: linear-gradient(155deg, rgba(115, 64, 209, 0.94), rgba(65, 32, 139, 0.96));
  box-shadow:
    inset 0 -12px 0 rgba(33, 17, 91, 0.2),
    0 18px 0 rgba(42, 19, 100, 0.32),
    0 30px 60px rgba(23, 8, 58, 0.35);
}

.result-card.win {
  background: linear-gradient(155deg, rgba(34, 193, 199, 0.95), rgba(72, 61, 203, 0.96));
}

.result-kicker {
  margin-bottom: 13px;
  color: var(--yellow);
  font-size: 12px;
  font-weight: 1000;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.result-title {
  font-size: clamp(62px, 12vw, 102px);
  color: var(--pink);
  line-height: 0.82;
  transform: rotate(-1deg);
}

.result-card.win .result-title {
  color: var(--yellow);
}

.result-copy {
  margin: 27px 0 22px;
  font: 700 14px/1.55 Arial, sans-serif;
  color: rgba(255, 255, 255, 0.85);
}

.mobile-controls {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: none;
  pointer-events: none;
}

.joystick,
.jump-button {
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.joystick {
  position: absolute;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: 23px;
  width: 112px;
  height: 112px;
  border: 3px solid rgba(255, 255, 255, 0.36);
  border-radius: 50%;
  background: rgba(29, 16, 68, 0.33);
  box-shadow: inset 0 0 28px rgba(27, 10, 67, 0.25);
  backdrop-filter: blur(8px);
}

.joystick-knob {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border: 3px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  box-shadow: 0 6px 12px rgba(28, 12, 66, 0.2);
  font-size: 20px;
}

.jump-button {
  position: absolute;
  right: 25px;
  bottom: max(36px, calc(env(safe-area-inset-bottom) + 12px));
  width: 84px;
  height: 84px;
  border: 4px solid #fff;
  border-radius: 50%;
  background: linear-gradient(#4ae9ff, #21bde8);
  box-shadow:
    inset 0 -7px 0 rgba(20, 97, 148, 0.25),
    0 8px 0 #43228d;
  cursor: pointer;
  font-size: 11px;
  font-weight: 1000;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.jump-button:active {
  transform: translateY(5px);
  box-shadow:
    inset 0 -4px 0 rgba(20, 97, 148, 0.25),
    0 3px 0 #43228d;
}

@media (hover: none), (max-width: 760px) {
  .mobile-controls.playing {
    display: block;
  }

  .hint-bar {
    display: none;
  }

  .survivor-card {
    min-width: 112px;
    padding: 8px 12px 10px;
  }

  .survivor-count {
    font-size: 19px;
  }

  .survivor-count b {
    font-size: 27px;
  }

  .match-info {
    top: 78px;
  }

  .hero-copy {
    margin-top: 27px;
    font-size: 14px;
  }

  .intro-meta {
    gap: 10px;
    font-size: 8px;
  }
}

@media (max-height: 650px) {
  .intro-card {
    transform: scale(0.84);
  }

  .hero-copy {
    margin-top: 23px;
    margin-bottom: 16px;
  }

  .intro-meta {
    margin-top: 19px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .countdown,
  .primary-button {
    animation: none;
    transition: none;
  }
}
</style>
