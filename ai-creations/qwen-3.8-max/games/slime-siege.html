<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 25%, #1d1c2c 0%, #0a0910 70%);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    color: #cfd3e2;
    overflow: hidden;
  }
  body { display: grid; place-items: center; padding: 16px; }
  #shell { width: min(100%, 1180px); display: flex; flex-direction: column; gap: 10px; }
  #game {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 214, 102, 0.22);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255,255,255,0.03);
    background: #0a0910;
    aspect-ratio: 16 / 9;
  }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 18px; letter-spacing: 0.14em; color: #ffd45e; text-transform: uppercase;
  }
  footer {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 12.5px; color: #6e7288; padding: 0 4px;
  }
  footer b { color: #98a0bb; font-weight: 600; }
  @media (max-width: 640px) { footer { justify-content: center; text-align: center; } }
</style>

    c.lineWidth = rr(1.2, 2.6);
    c.beginPath();
    c.moveTo(x, y);
    for (let j = 0; j < ri(2, 4); j++) {
      a += rr(-0.6, 0.6);
      x += Math.cos(a) * rr(18, 46);
      y += Math.sin(a) * rr(18, 46);
      c.lineTo(x, y);
    }
    c.stroke();
  }
  c.restore();

  // duelling-ring markings in the centre
  c.save();
  c.strokeStyle = 'rgba(255,214,102,0.055)';
  c.lineWidth = 6;
  for (const r of [200, 330, 470]) { c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke(); }
  c.restore();

  // darken toward the rim so the centre reads as the stage
  const rim = c.createRadialGradient(cx, cy, WORLD_H * 0.26, cx, cy, WORLD_W * 0.56);
  rim.addColorStop(0, 'rgba(0,0,0,0)');
  rim.addColorStop(1, 'rgba(9,8,14,0.85)');
  c.fillStyle = rim;
  c.fillRect(0, 0, WORLD_W, WORLD_H);
  c.restore();

  // arena rim ring + inner boundary hint
  c.save();
  c.lineWidth = 34;
  c.strokeStyle = 'rgba(14,12,20,0.8)';
  c.beginPath();
  c.ellipse(cx, cy, WORLD_W / 2 - 34, WORLD_H / 2 - 34, 0, 0, Math.PI * 2);
  c.stroke();
  c.lineWidth = 3;
  c.strokeStyle = 'rgba(255,214,102,0.12)';
  c.setLineDash([26, 20]);
  c.beginPath();
  c.ellipse(cx, cy, WORLD_W / 2 - WALL + 12, WORLD_H / 2 - WALL + 12, 0, 0, Math.PI * 2);
  c.stroke();
  c.restore();

  return g;
}

/* ---------------------------------------------------------------- entities */
function makePlayer() {
  return {
    x: WORLD_W / 2, y: WORLD_H / 2,
    vx: 0, vy: 0,
    radius: 19, size: 84,
    hp: 100, maxHp: 100,
    mana: 3, maxMana: 3, manaRegen: 0.32,
    speed: 212, dmg: 34, atkCd: 0.4, reach: 82, arrowDmg: 30,
    armor: 1, lifesteal: 0, magnet: 1, coinValue: 1, burst: 0,
    dashCd: 1.15,
    face: 1, facingUp: false, aim: 0,
    swing: 0, swingDir: 1, cd: 0, bowCd: 0, iframes: 0, dashT: 0, dashCool: 0,
    hurtFlash: 0, walkT: 0,
  };
}

function spawnEnemy(kind, x, y) {
  const t = ENEMY_TYPES[kind];
  const scale = 1 + (game.wave - 1) * 0.095;
  game.enemies.push({
    kind, x, y, vx: 0, vy: 0,
    hp: t.hp * scale, maxHp: t.hp * scale,
    speed: t.speed * (1 + (game.wave - 1) * 0.018) * random(0.92, 1.08),
    dmg: t.dmg * (1 + (game.wave - 1) * 0.07),
    radius: t.radius, size: t.size, score: t.score,
    frame: t.frame, heavy: !!t.heavy, hop: !!t.hop, tint: t.tint,
    touchCd: 0, hurtFlash: 0, birth: 0.45, bob: random(0, 6.28),
    knockX: 0, knockY: 0,
  });
}

function spawnPickup(kind, x, y) {
  game.pickups.push({
    kind, x, y, t: 0, vx: random(-40, 40), vy: random(-40, 40),
    life: kind === 'coin' ? 22 : 30,
    size: kind === 'coin' ? 34 : kind === 'potion' ? 40 : 38,
    frame: kind === 'coin' ? F.coin : kind === 'potion' ? F.potion : F.crystal,
  });
}

function spawnDamage(x, y, text, color) {
  game.numbers.push({ x, y, text, color, t: 0 });
}

/* ---------------------------------------------------------------- waves --- */
function waveBudget(n) { return 5 + Math.round(n * 2.9); }

function waveComposition(n) {
  const pool = ['grunt'];
  if (n >= 2) pool.push('hopper');
  if (n >= 3) pool.push('swarm', 'swarm');
  if (n >= 4) pool.push('brute');
  if (n >= 6) pool.push('hopper', 'brute');
  const list = [];
  let budget = waveBudget(n);
  while (budget > 0) {
    const kind = pick(pool);
    const cost = kind === 'brute' ? 4 : kind === 'grunt' ? 2 : 1;
    if (cost > budget && list.length) break;
    list.push(kind);
    budget -= cost;
  }
  return list;
}

function startWave(n) {
  game.wave = n;
  game.queue = waveComposition(n);
  game.spawnTimer = 0.7;
  game.waveActive = true;
  banner(`WAVE ${n}`);
  audio.sfx('powerup');
}

function banner(text) { bannerText = text; bannerT = 2.2; }

function newGame() {
  game = {
    player: makePlayer(),
    enemies: [], pickups: [], arrows: [], numbers: [], crates: [], props: [], portals: [], fires: [],
    wave: 0, queue: [], spawnTimer: 0, waveActive: false, intermission: 0,
    score: 0, gold: 0, kills: 0, chest: null, choices: null,
  };
  timeAlive = 0;

  // portals at four points on the arena rim
  const cx = WORLD_W / 2, cy = WORLD_H / 2, rx = WORLD_W / 2 - 150, ry = WORLD_H / 2 - 130;
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    game.portals.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, t: random(0, 6) });
  }
  // campfires
  game.fires.push({ x: cx - 420, y: cy + 300, t: 0 }, { x: cx + 430, y: cy - 290, t: 0 });

  // decorative rocks / trees around the rim + crates inside
  for (let i = 0; i < 34; i++) {
    const a = random(0, Math.PI * 2);
    const rr = random(1.0, 1.14);
    game.props.push({
      x: cx + Math.cos(a) * (WORLD_W / 2 - 62) * rr,
      y: cy + Math.sin(a) * (WORLD_H / 2 - 55) * rr,
      frame: chance(0.55) ? F.tree : F.rock,
      size: random(110, 165),
      flip: chance(),
    });
  }
  for (let i = 0; i < 9; i++) {
    const a = random(0, Math.PI * 2), d = random(200, WORLD_W / 2 - 260);
    game.crates.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d * 0.72, hp: 20, size: 62, radius: 24, hurtFlash: 0 });
  }

  cam.x = game.player.x; cam.y = game.player.y;
  startWave(1);
}

/* ---------------------------------------------------------------- combat -- */
function damageEnemy(e, amount, kx = 0, ky = 0, crit = false) {
  e.hp -= amount;
  e.hurtFlash = 1;
  e.knockX += kx; e.knockY += ky;
  spawnDamage(e.x, e.y - e.size * 0.45, Math.round(amount), crit ? '#ffd45e' : '#ffffff');
  blood.emit(e.x, e.y - e.size * 0.22, 7, { colors: [e.tint, '#d9ffb0', '#4fa03d'], speed: [60, 210], life: [0.2, 0.5], size: [3, 8] });
  if (e.hp <= 0) killEnemy(e);
  else audio.sfx('hit');
}

function killEnemy(e) {
  const p = game.player;
  e.dead = true;
  game.kills++;
  game.score += e.score;
  hitStop = Math.max(hitStop, e.heavy ? 0.09 : 0.04);
  cam.shake(e.heavy ? 11 : 5, e.heavy ? 0.28 : 0.14);
  blood.emit(e.x, e.y - e.size * 0.2, e.heavy ? 34 : 16, {
    colors: [e.tint, '#d9ffb0', '#ffffff'], speed: [80, 300], life: [0.3, 0.8], size: [4, 11],
  });
  audio.sfx('hit');
  audio.tone({ frequency: e.heavy ? 120 : 260, endFrequency: 60, duration: 0.16, type: 'triangle', volume: 0.14 });

  if (p.lifesteal) p.hp = Math.min(p.maxHp, p.hp + p.lifesteal);

  // drops
  const rolls = e.heavy ? 4 : 1;
  for (let i = 0; i < rolls; i++) {
    if (chance(0.62)) spawnPickup('coin', e.x + random(-14, 14), e.y + random(-14, 14));
    else if (chance(0.3)) spawnPickup('crystal', e.x, e.y);
    else if (chance(0.12)) spawnPickup('potion', e.x, e.y);
  }
  // shard burst upgrade
  if (p.burst && chance(p.burst)) {
    sparkle.emit(e.x, e.y, 26, { colors: ['#8fd8ff', '#ffffff'], speed: [120, 320], life: [0.25, 0.6], size: [3, 7] });
    for (const o of game.enemies) {
      if (o === e || o.dead) continue;
      if (distance(o, e) < 130) damageEnemy(o, p.dmg * 0.6, (o.x - e.x) * 1.6, (o.y - e.y) * 1.6);
    }
  }
}

function playerHit(amount) {
  const p = game.player;
  if (p.iframes > 0 || p.dashT > 0) return;
  const dealt = amount * p.armor;
  p.hp -= dealt;
  p.iframes = 0.62;
  p.hurtFlash = 1;
  flash = 0.5;
  cam.shake(14, 0.3);
  audio.noise({ duration: 0.14, volume: 0.3, filter: 700 });
  spawnDamage(p.x, p.y - 50, `-${Math.round(dealt)}`, '#ff6b6b');
  if (p.hp <= 0) {
    p.hp = 0;
    gameOver();
  }
}

function gameOver() {
  screen = State.OVER;
  audio.tone({ frequency: 320, endFrequency: 60, duration: 0.9, type: 'sawtooth', volume: 0.2 });
  if (game.score > best.score) {
    best = { score: game.score, wave: game.wave };
    // some browsers block storage on file:// — a lost high score must not kill the run
    try { saveJSON('slimesiege.best', best); } catch { /* ignore */ }
  }
}

function doSwing() {
  const p = game.player;
  if (p.cd > 0) return;
  p.cd = p.atkCd;
  p.swing = 0.24;
  p.swingDir *= -1;
  audio.tone({ frequency: 620, endFrequency: 240, duration: 0.1, type: 'triangle', volume: 0.12 });
  audio.noise({ duration: 0.07, volume: 0.1, filter: 2600 });

  const hitAny = [];
  for (const e of game.enemies) {
    if (e.dead || e.birth > 0) continue;
    const d = distance(p, e);
    if (d > p.reach + e.radius) continue;
    let diff = Math.abs(((angleTo(p, e) - p.aim + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (diff > 1.05) continue;
    hitAny.push(e);
  }
  for (const e of hitAny) {
    const a = angleTo(p, e);
    const crit = chance(0.15);
    damageEnemy(e, p.dmg * (crit ? 1.8 : 1), Math.cos(a) * 260, Math.sin(a) * 260, crit);
  }
  for (const c of game.crates) {
    if (c.dead) continue;
    if (distance(p, c) < p.reach + c.radius) {
      c.hp -= p.dmg; c.hurtFlash = 1;
      if (c.hp <= 0) {
        c.dead = true;
        cam.shake(6, 0.15);
        particles.emit(c.x, c.y, 22, { colors: ['#b5793c', '#8a5a2b', '#e0b070'], speed: [70, 240], life: [0.3, 0.7], size: [4, 10] });
        for (let i = 0; i < randomInt(2, 4); i++) spawnPickup('coin', c.x + random(-18, 18), c.y + random(-18, 18));
        audio.sfx('hit');
      }
    }
  }
  if (hitAny.length) cam.shake(6, 0.12);
}

function shootArrow() {
  const p = game.player;
  if (p.mana < 1 || p.bowCd > 0) return;
  p.mana -= 1;
  p.bowCd = 0.3;
  p.swing = 0.16;
  game.arrows.push({ x: p.x, y: p.y - 12, a: p.aim, speed: 720, dmg: p.arrowDmg, life: 1.1, hits: new Set() });
  audio.sfx('laser');
}

/* ---------------------------------------------------------------- update -- */
function update(dt) {
  menuT += dt;
  if (hitStop > 0) { hitStop -= dt; keys.endFrame(); pointer.endFrame(); return; }

  if (screen === State.MENU || screen === State.OVER) {
    if (keys.wasPressed('Enter') || keys.wasPressed('Space') || pointer.clicked) {
      newGame(); screen = State.PLAY;
    }
    keys.endFrame(); pointer.endFrame();
    return;
  }

  if (keys.wasPressed('KeyP') || keys.wasPressed('Escape')) {
    if (screen === State.PLAY) screen = State.PAUSE;
    else if (screen === State.PAUSE) screen = State.PLAY;
  }
  if (keys.wasPressed('KeyM')) { muted = !muted; audio.mute(muted); }

  if (screen === State.PAUSE) { keys.endFrame(); pointer.endFrame(); return; }

  if (screen === State.UPGRADE) {
    for (let i = 0; i < 3; i++) {
      if (keys.wasPressed(`Digit${i + 1}`)) chooseUpgrade(i);
    }
    if (keys.wasPressed('KeyR')) tryReroll();
    if (pointer.clicked) {
      const idx = upgradeCardAt(pointer.x, pointer.y);
      if (idx >= 0) chooseUpgrade(idx);
      else if (pointInRect({ x: pointer.x, y: pointer.y }, rerollRect())) tryReroll();
    }
    keys.endFrame(); pointer.endFrame();
    return;
  }

  /* ------- playing ------- */
  timeAlive += dt;
  flash = Math.max(0, flash - dt * 2.2);
  bannerT = Math.max(0, bannerT - dt);
  const p = game.player;

  // aim toward pointer in world space
  const wx = pointer.x - VIEW_W / 2 + cam.x;
  const wy = pointer.y - VIEW_H / 2 + cam.y;
  p.aim = Math.atan2(wy - p.y, wx - p.x);

  // movement
  let ix = keys.axis('KeyA', 'KeyD') + keys.axis('ArrowLeft', 'ArrowRight');
  let iy = keys.axis('KeyW', 'KeyS') + keys.axis('ArrowUp', 'ArrowDown');
  ix = clamp(ix, -1, 1); iy = clamp(iy, -1, 1);
  const mv = new Vec2(ix, iy);
  if (mv.length() > 0) mv.normalize();

  p.dashCool = Math.max(0, p.dashCool - dt);
  if ((keys.wasPressed('ShiftLeft') || keys.wasPressed('ShiftRight')) && p.dashCool <= 0) {
    p.dashT = 0.17; p.dashCool = p.dashCd;
    p.dashVX = (mv.length() ? mv.x : Math.cos(p.aim));
    p.dashVY = (mv.length() ? mv.y : Math.sin(p.aim));
    audio.sfx('jump');
    particles.emit(p.x, p.y + 24, 16, { colors: ['#cfd6e6', '#8e9bb5'], speed: [40, 150], life: [0.2, 0.45], size: [3, 8] });
  }

  let sp = p.speed;
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.x += p.dashVX * sp * 3.3 * dt;
    p.y += p.dashVY * sp * 3.3 * dt;
    if (chance(0.7)) particles.emit(p.x, p.y + 20, 2, { colors: ['#a8b6d6'], speed: [10, 60], life: [0.15, 0.35], size: [3, 7] });
  } else {
    p.x += mv.x * sp * dt;
    p.y += mv.y * sp * dt;
  }

  if (mv.length() > 0) {
    p.walkT += dt;
    if (Math.abs(mv.x) > 0.2) p.face = mv.x > 0 ? 1 : -1;
    p.facingUp = mv.y < -0.55 && Math.abs(mv.x) < 0.6;
  } else p.walkT = 0;

  // keep inside the arena ellipse
  const cx = WORLD_W / 2, cy = WORLD_H / 2;
  const ax = WORLD_W / 2 - WALL, ay = WORLD_H / 2 - WALL;
  const nx = (p.x - cx) / ax, ny = (p.y - cy) / ay;
  const nd = Math.hypot(nx, ny);
  if (nd > 1) { p.x = cx + nx / nd * ax; p.y = cy + ny / nd * ay; }

  // combat inputs
  p.cd = Math.max(0, p.cd - dt);
  p.bowCd = Math.max(0, (p.bowCd || 0) - dt);
  p.swing = Math.max(0, p.swing - dt);
  p.iframes = Math.max(0, p.iframes - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt * 3);
  p.mana = Math.min(p.maxMana, p.mana + p.manaRegen * dt);

  if (keys.isDown('Space') || keys.wasPressed('Space') || pointer.down) doSwing();
  if (keys.isDown('KeyF') || keys.wasPressed('KeyF') || keys.isDown('KeyE')) shootArrow();

  // campfire regen
  for (const f of game.fires) {
    f.t += dt;
    if (distance(p, f) < 90) {
      p.hp = Math.min(p.maxHp, p.hp + 5 * dt);
      if (chance(0.25)) sparkle.emit(p.x + random(-14, 14), p.y - random(0, 40), 1, { colors: ['#ffd08a', '#ff8a3c'], speed: [10, 40], life: [0.3, 0.6], size: [2, 5] });
    }
  }

  // spawning
  if (game.waveActive && game.queue.length) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      game.spawnTimer = Math.max(0.16, 0.55 - game.wave * 0.02);
      const portal = pick(game.portals);
      const kind = game.queue.pop();
      spawnEnemy(kind, portal.x + random(-40, 40), portal.y + random(-30, 30));
      sparkle.emit(portal.x, portal.y, 14, { colors: ['#67d5ff', '#ffffff', '#3aa8ff'], speed: [40, 170], life: [0.25, 0.6], size: [3, 8] });
    }
  }

  // enemies
  for (const e of game.enemies) {
    if (e.dead) continue;
    if (e.birth > 0) { e.birth -= dt; continue; }
    e.bob += dt * (e.hop ? 9 : 4);
    e.hurtFlash = Math.max(0, e.hurtFlash - dt * 3.4);
    e.touchCd = Math.max(0, e.touchCd - dt);

    const a = angleTo(e, p);
    let spd = e.speed;
    if (e.hop) spd *= 0.55 + Math.max(0, Math.sin(e.bob)) * 1.5;
    e.x += Math.cos(a) * spd * dt + e.knockX * dt;
    e.y += Math.sin(a) * spd * dt + e.knockY * dt;
    e.knockX *= 0.86; e.knockY *= 0.86;

    if (distance(e, p) < e.radius + p.radius && e.touchCd <= 0) {
      e.touchCd = 0.75;
      playerHit(e.dmg);
      const ka = angleTo(p, e);
      e.knockX += Math.cos(ka) * 190; e.knockY += Math.sin(ka) * 190;
    }
  }

  // separation (cheap, only against nearby)
  for (let i = 0; i < game.enemies.length; i++) {
    const a = game.enemies[i];
    if (a.dead || a.birth > 0) continue;
    for (let j = i + 1; j < game.enemies.length; j++) {
      const b = game.enemies[j];
      if (b.dead || b.birth > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const need = a.radius + b.radius;
      const d2 = dx * dx + dy * dy;
      if (d2 > need * need || d2 === 0) continue;
      const d = Math.sqrt(d2);
      const push = (need - d) / 2;
      const ux = dx / d, uy = dy / d;
      const wA = b.heavy && !a.heavy ? 1.7 : 1, wB = a.heavy && !b.heavy ? 1.7 : 1;
      a.x -= ux * push * wA; a.y -= uy * push * wA;
      b.x += ux * push * wB; b.y += uy * push * wB;
    }
  }

  // arrows
  for (const ar of game.arrows) {
    ar.life -= dt;
    ar.x += Math.cos(ar.a) * ar.speed * dt;
    ar.y += Math.sin(ar.a) * ar.speed * dt;
    for (const e of game.enemies) {
      if (e.dead || e.birth > 0 || ar.hits.has(e)) continue;
      if (distance(ar, e) < e.radius + 12) {
        ar.hits.add(e);
        damageEnemy(e, ar.dmg, Math.cos(ar.a) * 150, Math.sin(ar.a) * 150);
        ar.life = Math.min(ar.life, 0.02);
      }
    }
    if (chance(0.6)) sparkle.emit(ar.x, ar.y, 1, { colors: ['#ffe9a8', '#ffffff'], speed: [5, 25], life: [0.1, 0.25], size: [2, 4] });
  }
  game.arrows = game.arrows.filter(a => a.life > 0);

  // pickups
  const magnetR = 95 * p.magnet;
  for (const it of game.pickups) {
    it.t += dt; it.life -= dt;
    const d = distance(it, p);
    if (d < magnetR) {
      const a = angleTo(it, p);
      const pull = mapRange(d, 0, magnetR, 620, 120);
      it.vx = lerp(it.vx, Math.cos(a) * pull, 0.22);
      it.vy = lerp(it.vy, Math.sin(a) * pull, 0.22);
    } else { it.vx *= 0.9; it.vy *= 0.9; }
    it.x += it.vx * dt; it.y += it.vy * dt;
    if (d < 26) {
      it.dead = true;
      if (it.kind === 'coin') { game.gold += p.coinValue; game.score += 5 * p.coinValue; audio.sfx('coin'); }
      else if (it.kind === 'potion') { p.hp = Math.min(p.maxHp, p.hp + 28); audio.sfx('powerup'); spawnDamage(p.x, p.y - 54, '+28', '#7ef08a'); }
      else { p.mana = Math.min(p.maxMana, p.mana + 1); audio.sfx('click'); }
      sparkle.emit(it.x, it.y, 8, { colors: ['#ffe9a8', '#ffffff'], speed: [40, 130], life: [0.2, 0.45], size: [2, 6] });
    }
  }
  game.pickups = game.pickups.filter(i => !i.dead && i.life > 0);

  // damage numbers
  for (const n of game.numbers) { n.t += dt; n.y -= 44 * dt; }
  game.numbers = game.numbers.filter(n => n.t < 0.85);

  for (const c of game.crates) c.hurtFlash = Math.max(0, c.hurtFlash - dt * 3);
  for (const pt of game.portals) pt.t += dt;
  game.enemies = game.enemies.filter(e => !e.dead);

  // wave clear -> chest
  if (game.waveActive && !game.queue.length && !game.enemies.length) {
    game.waveActive = false;
    banner('WAVE CLEARED');
    audio.sfx('powerup');
    game.chest = { x: p.x + Math.cos(p.aim) * 130, y: p.y + Math.sin(p.aim) * 130, t: 0 };
    game.chest.x = clamp(game.chest.x, cx - ax + 60, cx + ax - 60);
    game.chest.y = clamp(game.chest.y, cy - ay + 60, cy + ay - 60);
  }
  if (game.chest) {
    game.chest.t += dt;
    if (distance(game.chest, p) < 46) {
      audio.sfx('powerup');
      sparkle.emit(game.chest.x, game.chest.y, 40, { colors: ['#ffd45e', '#fff3c4', '#ffffff'], speed: [60, 260], life: [0.3, 0.8], size: [3, 9] });
      game.chest = null;
      openUpgrades();
    }
  }

  particles.update(dt); blood.update(dt); sparkle.update(dt);
  cam.follow({ x: lerp(p.x, wx, 0.12), y: lerp(p.y, wy, 0.12) }, 0.12);
  cam.x = clamp(cam.x, VIEW_W / 2, WORLD_W - VIEW_W / 2);
  cam.y = clamp(cam.y, VIEW_H / 2, WORLD_H - VIEW_H / 2);
  cam.update(dt);

  keys.endFrame(); pointer.endFrame();
}

/* ---------------------------------------------------------------- upgrades */
const REROLL_COST = 25;

function rollChoices() {
  const pool = [...UPGRADES];
  const choices = [];
  const usedIcons = new Set();
  while (choices.length < 3 && pool.length) {
    // try for a distinct icon so the three cards read differently
    let idx = -1;
    for (let tries = 0; tries < 8; tries++) {
      const k = randomInt(0, pool.length - 1);
      if (!usedIcons.has(pool[k].frame)) { idx = k; break; }
    }
    if (idx < 0) idx = randomInt(0, pool.length - 1);
    const u = pool.splice(idx, 1)[0];
    usedIcons.add(u.frame);
    choices.push(u);
  }
  return choices;
}

function openUpgrades() {
  game.choices = rollChoices();
  screen = State.UPGRADE;
}

function rerollRect() {
  return { x: VIEW_W / 2 - 96, y: VIEW_H - 66, width: 192, height: 42 };
}

function tryReroll() {
  if (game.gold < REROLL_COST) { audio.tone({ frequency: 160, endFrequency: 110, duration: 0.12, type: 'square', volume: 0.1 }); return; }
  game.gold -= REROLL_COST;
  game.choices = rollChoices();
  audio.sfx('click');
}

function cardRects() {
  const w = 232, h = 284, gap = 32;
  const total = w * 3 + gap * 2;
  const x0 = (VIEW_W - total) / 2, y = 156;
  return [0, 1, 2].map(i => ({ x: x0 + i * (w + gap), y, width: w, height: h }));
}

function upgradeCardAt(px, py) {
  const rects = cardRects();
  for (let i = 0; i < rects.length; i++) if (pointInRect({ x: px, y: py }, rects[i])) return i;
  return -1;
}

function chooseUpgrade(i) {
  const u = game.choices?.[i];
  if (!u) return;
  u.apply(game.player);
  audio.sfx('powerup');
  game.choices = null;
  screen = State.PLAY;
  startWave(game.wave + 1);
}

/* ---------------------------------------------------------------- render -- */
function render() {
  ctx.imageSmoothingEnabled = true;
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);

  if (screen === State.MENU) { drawMenu(); return; }

  drawWorld();
  drawHUD();

  if (screen === State.UPGRADE) drawUpgrades();
  if (screen === State.PAUSE) drawPause();
  if (screen === State.OVER) drawGameOver();
}

function drawWorld() {
  const p = game.player;
  const ox = Math.round(VIEW_W / 2 - cam.x + cam.offsetX);
  const oy = Math.round(VIEW_H / 2 - cam.y + cam.offsetY);

  ctx.save();
  ctx.translate(ox, oy);

  // ground blit (only the visible slice)
  const sx = clamp(cam.x - VIEW_W / 2 - 40, 0, WORLD_W - 1);
  const sy = clamp(cam.y - VIEW_H / 2 - 40, 0, WORLD_H - 1);
  const sw = Math.min(VIEW_W + 80, WORLD_W - sx);
  const sh = Math.min(VIEW_H + 80, WORLD_H - sy);
  ctx.drawImage(ground, sx, sy, sw, sh, sx, sy, sw, sh);

  // portals (under everything)
  for (const pt of game.portals) {
    const pulse = 0.72 + Math.sin(pt.t * 2.4) * 0.12;
    sheet.draw(ctx, F.portal, pt.x, pt.y, { width: 132 * pulse, height: 132 * pulse, alpha: 0.55 + Math.sin(pt.t * 2.4) * 0.12 });
  }

  // chest marker beam
  if (game.chest) {
    const c = game.chest;
    ctx.save();
    ctx.globalAlpha = 0.25 + Math.sin(c.t * 4) * 0.1;
    const g = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, 130);
    g.addColorStop(0, '#ffd45e'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, 130, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  particles.draw(ctx);

  // depth-sorted drawables
  const draws = [];

  for (const pr of game.props) draws.push({ y: pr.y, fn: () => {
    shadow(pr.x, pr.y + pr.size * 0.34, pr.size * 0.7, 0.3);
    sheet.draw(ctx, pr.frame, pr.x, pr.y, { width: pr.size, height: pr.size, flipX: pr.flip });
  }});

  for (const f of game.fires) draws.push({ y: f.y, fn: () => {
    const s = 84 + Math.sin(f.t * 8) * 4;
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(f.t * 6) * 0.06;
    const g = ctx.createRadialGradient(f.x, f.y, 6, f.x, f.y, 120);
    g.addColorStop(0, '#ff9a3c'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 120, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    sheet.draw(ctx, F.campfire, f.x, f.y, { width: s, height: s });
  }});

  for (const c of game.crates) {
    if (c.dead) continue;
    draws.push({ y: c.y, fn: () => {
      shadow(c.x, c.y + c.size * 0.32, c.size * 0.72);
      flashSprite(F.crate, c.x, c.y, c.size, {}, c.hurtFlash);
    }});
  }

  for (const it of game.pickups) {
    const bobY = Math.sin(it.t * 5) * 5;
    const fade = it.life < 4 ? (Math.sin(it.life * 14) * 0.5 + 0.5) : 1;
    draws.push({ y: it.y, fn: () => {
      shadow(it.x, it.y + 12, it.size * 0.5, 0.2);
      sheet.draw(ctx, it.frame, it.x, it.y - 8 + bobY, { width: it.size, height: it.size, alpha: fade });
    }});
  }

  if (game.chest) {
    const c = game.chest;
    draws.push({ y: c.y, fn: () => {
      shadow(c.x, c.y + 22, 70);
      const s = 78 + Math.sin(c.t * 4) * 5;
      sheet.draw(ctx, F.chest, c.x, c.y + Math.sin(c.t * 3) * 4, { width: s, height: s });
    }});
  }

  for (const e of game.enemies) {
    draws.push({ y: e.y, fn: () => drawEnemy(e) });
  }

  draws.push({ y: p.y, fn: () => drawPlayer(p) });

  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) d.fn();

  // arrows on top
  for (const ar of game.arrows) {
    ctx.save();
    ctx.translate(ar.x, ar.y);
    ctx.rotate(ar.a);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#f3e3b0';
    ctx.fillRect(-22, -2, 34, 4);
    ctx.fillStyle = '#cfd8e8';
    ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(24, 0); ctx.lineTo(12, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  blood.draw(ctx);
  sparkle.draw(ctx);

  // floating damage numbers
  ctx.save();
  ctx.font = 'bold 20px "Trebuchet MS", system-ui, sans-serif';
  ctx.textAlign = 'center';
  for (const n of game.numbers) {
    ctx.globalAlpha = 1 - n.t / 0.85;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(n.text, n.x, n.y);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, n.x, n.y);
  }
  ctx.restore();

  ctx.restore();

  // vignette + hurt flash
  const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.35, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.95);
  vg.addColorStop(0, 'transparent'); vg.addColorStop(1, 'rgba(4,4,10,0.72)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  if (flash > 0) {
    ctx.save(); ctx.globalAlpha = flash * 0.4; ctx.fillStyle = '#c0392b';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.restore();
  }
}

function drawPlayer(p) {
  const bob = Math.sin(p.walkT * 12) * 3;
  shadow(p.x, p.y + 30, 62);

  // swing arc
  if (p.swing > 0) {
    const t = 1 - p.swing / 0.24;
    ctx.save();
    ctx.translate(p.x, p.y - 6);
    ctx.rotate(p.aim + p.swingDir * lerp(-1.0, 1.0, t) * -1);
    ctx.globalAlpha = (1 - t) * 0.85;
    const g = ctx.createLinearGradient(0, 0, p.reach, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.6, 'rgba(190,225,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0.1)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, p.reach * 0.82, -0.75, 0.75);
    ctx.stroke();
    ctx.restore();
  }

  let frame = F.heroIdle;
  if (p.swing > 0) frame = F.heroAttack;
  else if (p.facingUp) frame = F.heroBack;
  else if (p.walkT > 0) frame = F.heroRun;

  const flip = p.aim > Math.PI / 2 || p.aim < -Math.PI / 2;
  const blink = (p.iframes > 0 && Math.floor(p.iframes * 18) % 2 === 0) ? 0.42 : 1;
  flashSprite(frame, p.x, p.y - 8 + bob, p.size, { flipX: flip, alpha: blink }, p.hurtFlash);
}

function drawEnemy(e) {
  if (e.birth > 0) {
    const t = 1 - e.birth / 0.45;
    const s2 = e.size * ease.outBack(t);
    sheet.draw(ctx, e.frame, e.x, e.y, { width: s2, height: s2, alpha: t });
    return;
  }
  const hop = e.hop ? Math.abs(Math.sin(e.bob)) * 16 : Math.sin(e.bob) * 3;
  const squash = e.hop ? 1 + Math.sin(e.bob) * 0.06 : 1;
  shadow(e.x, e.y + e.size * 0.28, e.size * 0.62, 0.3 - (e.hop ? hop / 140 : 0));
  flashSprite(e.frame, e.x, e.y - hop, e.size * squash, {}, e.hurtFlash);

  // hp bar for damaged enemies
  if (e.hp < e.maxHp) {
    const w = e.size * 0.6, h = 5;
    const x = e.x - w / 2, y = e.y - e.size * 0.52 - hop;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = e.heavy ? '#ff7b4a' : '#8ef07a';
    ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), h);
    ctx.restore();
  }
}

/* ---------------------------------------------------------------- UI ------ */
function panel(x, y, w, h, r = 14, fill = 'rgba(14,14,24,0.86)', stroke = 'rgba(255,214,102,0.5)') {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke();
  ctx.restore();
}

function text(str, x, y, { size = 18, color = '#fff', align = 'left', weight = 'bold', outline = 'rgba(0,0,0,0.7)', font = '"Trebuchet MS", system-ui, sans-serif' } = {}) {
  ctx.save();
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  if (outline) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function drawHUD() {
  const p = game.player;

  // health
  panel(16, 14, 300, 62, 12);
  sheet.draw(ctx, F.shield, 46, 45, { width: 46, height: 46 });
  const bx = 74, by = 26, bw = 226, bh = 18;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill();
  const hpPct = clamp(p.hp / p.maxHp, 0, 1);
  const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hg.addColorStop(0, '#ff5f57'); hg.addColorStop(1, '#ff9d4d');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.roundRect(bx, by, Math.max(4, bw * hpPct), bh, 6); ctx.fill();
  ctx.restore();
  text(`${Math.ceil(p.hp)} / ${Math.round(p.maxHp)}`, bx + bw / 2, by + 14, { size: 13, align: 'center' });

  // mana pips
  for (let i = 0; i < p.maxMana; i++) {
    const px = bx + 6 + i * 20;
    sheet.draw(ctx, F.crystal, px, by + 34, { width: 24, height: 24, alpha: p.mana >= i + 1 ? 1 : 0.22 });
  }

  // right stats
  panel(VIEW_W - 246, 14, 230, 62, 12);
  sheet.draw(ctx, F.coin, VIEW_W - 216, 34, { width: 30, height: 30 });
  text(`${game.gold}`, VIEW_W - 196, 42, { size: 20, color: '#ffd45e' });
  text(`SCORE ${game.score}`, VIEW_W - 30, 42, { size: 18, align: 'right' });
  text(`WAVE ${game.wave}`, VIEW_W - 30, 66, { size: 15, align: 'right', color: '#9fd2ff' });
  text(`${game.enemies.length + game.queue.length} left`, VIEW_W - 216, 66, { size: 14, color: '#c8c8d8' });

  // cooldown pips bottom-left
  const cdY = VIEW_H - 30;
  sheet.draw(ctx, F.sword, 40, cdY, { width: 40, height: 40, alpha: p.cd <= 0 ? 1 : 0.3 });
  sheet.draw(ctx, F.crystal, 90, cdY, { width: 36, height: 36, alpha: p.dashCool <= 0 ? 1 : 0.3 });
  sheet.draw(ctx, F.bow, 140, cdY, { width: 40, height: 40, alpha: p.mana >= 1 ? 1 : 0.3 });
  text('LMB', 40, VIEW_H - 4, { size: 11, align: 'center', color: '#aab' });
  text('SHIFT', 90, VIEW_H - 4, { size: 11, align: 'center', color: '#aab' });
  text('F', 140, VIEW_H - 4, { size: 11, align: 'center', color: '#aab' });

  // banner
  if (bannerT > 0 && screen === State.PLAY) {
    const a = Math.min(1, bannerT / 0.5);
    ctx.save();
    ctx.globalAlpha = a;
    text(bannerText, VIEW_W / 2, 130, { size: 52, align: 'center', color: '#ffd45e' });
    ctx.restore();
  }

  if (game.chest) text('A chest appeared — grab it', VIEW_W / 2, VIEW_H - 40, { size: 18, align: 'center', color: '#ffd45e' });

  text(muted ? 'M: unmute' : 'M: mute   P: pause', VIEW_W - 16, VIEW_H - 12, { size: 12, align: 'right', color: '#7f8497', outline: null });
}

function drawUpgrades() {
  ctx.save();
  ctx.fillStyle = 'rgba(6,6,14,0.78)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.restore();
  text('CHOOSE A BOON', VIEW_W / 2, 86, { size: 40, align: 'center', color: '#ffd45e' });
  text('click a card, or press 1 / 2 / 3', VIEW_W / 2, 112, { size: 15, align: 'center', color: '#b9bdd0' });
  sheet.draw(ctx, F.coin, VIEW_W / 2 - 40, 134, { width: 24, height: 24 });
  text(`${game.gold} gold`, VIEW_W / 2 - 24, 141, { size: 16, color: '#ffd45e' });

  const rects = cardRects();
  game.choices.forEach((u, i) => {
    const r = rects[i];
    const hovered = pointInRect({ x: pointer.x, y: pointer.y }, r);
    panel(r.x, r.y - (hovered ? 6 : 0), r.width, r.height, 16,
      hovered ? 'rgba(30,30,52,0.96)' : 'rgba(14,14,26,0.92)',
      hovered ? '#ffd45e' : 'rgba(255,214,102,0.4)');
    const cy = r.y - (hovered ? 6 : 0);
    sheet.draw(ctx, u.frame, r.x + r.width / 2, cy + 90, { width: 104, height: 104 });
    text(u.name, r.x + r.width / 2, cy + 176, { size: 21, align: 'center' });
    // wrap desc
    const words = u.desc.split(' ');
    let line = '', ly = cy + 206;
    ctx.font = '15px "Trebuchet MS", system-ui, sans-serif';
    for (const w of words) {
      if (ctx.measureText(line + w).width > r.width - 34) { text(line, r.x + r.width / 2, ly, { size: 15, align: 'center', color: '#c6cadb', weight: '' }); line = ''; ly += 20; }
      line += w + ' ';
    }
    text(line, r.x + r.width / 2, ly, { size: 15, align: 'center', color: '#c6cadb', weight: '' });
    text(`${i + 1}`, r.x + r.width / 2, cy + r.height - 22, { size: 20, align: 'center', color: '#ffd45e' });
  });

  // reroll button
  const rb = rerollRect();
  const canAfford = game.gold >= REROLL_COST;
  const hot = pointInRect({ x: pointer.x, y: pointer.y }, rb);
  panel(rb.x, rb.y, rb.width, rb.height, 10,
    canAfford && hot ? 'rgba(40,38,64,0.96)' : 'rgba(14,14,26,0.9)',
    canAfford ? 'rgba(255,214,102,0.55)' : 'rgba(120,120,140,0.3)');
  text(`REROLL — ${REROLL_COST} gold  (R)`, rb.x + rb.width / 2, rb.y + 27,
    { size: 15, align: 'center', color: canAfford ? '#ffd45e' : '#6f7386' });
}

function drawPause() {
  ctx.save();
  ctx.fillStyle = 'rgba(6,6,14,0.72)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.restore();
  text('PAUSED', VIEW_W / 2, VIEW_H / 2 - 6, { size: 54, align: 'center', color: '#ffd45e' });
  text('press P to resume', VIEW_W / 2, VIEW_H / 2 + 30, { size: 18, align: 'center', color: '#c6cadb' });
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(8,4,10,0.82)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.restore();
  text('YOU FELL', VIEW_W / 2, 170, { size: 62, align: 'center', color: '#ff6b6b' });
  sheet.draw(ctx, F.slimeAngry, VIEW_W / 2, 268, { width: 120, height: 120 });
  text(`Wave ${game.wave}   ·   ${game.kills} slimes slain   ·   ${game.gold} gold`, VIEW_W / 2, 360, { size: 20, align: 'center', color: '#e6e8f2' });
  text(`SCORE ${game.score}`, VIEW_W / 2, 402, { size: 34, align: 'center', color: '#ffd45e' });
  text(`best ${best.score} (wave ${best.wave})`, VIEW_W / 2, 430, { size: 15, align: 'center', color: '#9aa0b8' });
  text('click or press ENTER to fight again', VIEW_W / 2, 484, { size: 19, align: 'center', color: '#c6cadb' });
}

function drawMenu() {
  // backdrop
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, '#1b1a2b'); g.addColorStop(1, '#0d0c15');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  for (let i = 0; i < 8; i++) {
    const x = ((i * 173 + menuT * 24) % (VIEW_W + 300)) - 150;
    const y = 110 + Math.sin(menuT * 0.8 + i) * 54 + i * 40;
    sheet.draw(ctx, [F.slimeIdle, F.slimeHappy, F.slimeSwarm, F.slimeAngry][i % 4], x, y, { width: 150, height: 150, alpha: 0.09 });
  }

  sheet.draw(ctx, F.heroIdle, 132, 348 + Math.sin(menuT * 2) * 6, { width: 210, height: 210 });
  sheet.draw(ctx, F.slimeIdle, VIEW_W - 128, 372 - Math.abs(Math.sin(menuT * 3)) * 20, { width: 156, height: 156 });
  sheet.draw(ctx, F.slimeHappy, VIEW_W - 218, 402 - Math.abs(Math.sin(menuT * 3 + 1.2)) * 14, { width: 104, height: 104, alpha: 0.85 });

  text('SLIME SIEGE', VIEW_W / 2, 168, { size: 76, align: 'center', color: '#ffd45e' });
  text('an arena survivor built with ForgeKit', VIEW_W / 2, 200, { size: 17, align: 'center', color: '#9fd2ff' });

  panel(VIEW_W / 2 - 232, 238, 464, 150, 16);
  const lines = [
    'WASD / arrows — move',
    'mouse — aim   ·   left click or SPACE — swing',
    'SHIFT — dash (i-frames)   ·   F — fire arrow',
    'clear a wave, open the chest, pick a boon',
  ];
  lines.forEach((l, i) => text(l, VIEW_W / 2, 270 + i * 28, { size: 16, align: 'center', color: '#d3d7e6', weight: '' }));

  const pulse = 0.6 + Math.sin(menuT * 3.4) * 0.4;
  ctx.save(); ctx.globalAlpha = 0.55 + pulse * 0.45;
  text('click  or  press ENTER  to begin', VIEW_W / 2, 442, { size: 24, align: 'center', color: '#fff' });
  ctx.restore();

  if (best.score > 0) text(`best score ${best.score} — wave ${best.wave}`, VIEW_W / 2, 482, { size: 14, align: 'center', color: '#7f8497' });
  text('assets & engine: ForgeKit AI Game Asset Library (MIT)', VIEW_W / 2, VIEW_H - 14, { size: 12, align: 'center', color: '#5d6175', outline: null });
}

/* ---------------------------------------------------------------- boot ---- */
async function boot() {
  const host = document.getElementById('game');
  canvas = document.createElement('canvas');
  canvas.width = VIEW_W; canvas.height = VIEW_H;
  canvas.id = 'screen';
  host.append(canvas);
  ctx = canvas.getContext('2d');

  atlasImage = await loadImage(ATLAS_DATA_URL);
  sheet = new SpriteSheet(atlasImage, 6, 4);
  ground = buildGround();

  keys = new Keyboard();
  pointer = new Pointer(canvas);
  audio = new GameAudio();
  cam = new Camera2D(WORLD_W / 2, WORLD_H / 2);

  particles = new ParticleEmitter({ gravity: 260, drag: 0.97 });
  blood = new ParticleEmitter({ gravity: 210, drag: 0.94 });
  sparkle = new ParticleEmitter({ gravity: -30, drag: 0.93 });

  // stop the page scrolling / context menu stealing input
  const blocked = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
  window.addEventListener('keydown', e => { if (blocked.has(e.code)) e.preventDefault(); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const unlock = async () => { await audio.unlock(); audio.mute(muted); };
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });

  document.getElementById('loading')?.remove();

  loop = new GameLoop({ update, render });
  loop.start();

  // expose a little handle for debugging / automated smoke tests
  window.SlimeSiege = {
    get screen() { return screen; },
    get game() { return game; },
    start() { newGame(); screen = State.PLAY; },
    setScreen(s) { screen = s; },
  };
}

boot();

</script>
